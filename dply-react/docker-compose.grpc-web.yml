services:
  envoy:
    image: envoyproxy/envoy:v1.31.2
    container_name: dply-envoy
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - vpn-net

  dply-react:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dply-react
    environment:
      - REACT_APP_GRPC_WEB_HOST=http://envoy:4000
    depends_on:
      - envoy
    networks:
      - vpn-net

networks:
  vpn-net:
    external: true
